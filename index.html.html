<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2980b6">
<title>Laporan Belajar TKA · Bantuin Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Warna dari logo Bantuin Belajar: biru muda, biru tua, oranye pensil. Tambahan: kuning stabilo dan hijau mint. */
  --paper: #fbf8f1; --ruled: #d9e8f3; --ink: #0e2740; --muted: #52687c;
  --navy: #103c61; --brand: #2980b6; --brand-2: #8cbfe0; --sky: #dff0fb;
  --orange: #eb984c; --orange-d: #a8550c; --peach: #ffe6cc; --sun: #ffd166; --mint: #d3f2e4; --pink: #ffe0e0;
  --card: #ffffff; --bd: #103c61; --sh: 0 4px 0 #103c61; --road: #dbe7f0;
  --good: #167a50; --near: #8a5d00; --low: #c0392b;
  --good-bg: #d3f2e4; --near-bg: #fff0c2; --low-bg: #fde0dc;
  --g0: #2980b6; --g1: #d9782a; --g2: #1b9a68; --sel: #103c61;
  --sticky: #fff2a8; --sticky2: #cfeedd;
  --font-display: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0a1826; --ruled: #12304a; --ink: #e8f1f8; --muted: #9fb6c9;
    --navy: #0d3252; --brand: #4aa3da; --brand-2: #35688f; --sky: #16344e;
    --orange: #f0a35d; --orange-d: #f4b57a; --peach: #3a2a18; --sun: #ffd166; --mint: #173a2c; --pink: #40201d;
    --card: #11283d; --bd: #3f86b8; --sh: 0 4px 0 #3f86b8; --road: #1b3b57;
    --good: #5fcf98; --near: #e3b45d; --low: #f08a80;
    --good-bg: #173a2c; --near-bg: #3a3019; --low-bg: #40201d;
    --g0: #4aa3da; --g1: #f0a35d; --g2: #5fcf98; --sel: #bfe3fa;
    --sticky: #5a4d14; --sticky2: #1f4a39;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body { background-color: var(--paper); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--ruled) 31px, var(--ruled) 32px); }
#app { min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; }

/* ---------- bilah atas ---------- */
.topbar { position: sticky; top: 0; z-index: 4; background: var(--paper); border-bottom: 2.5px solid var(--bd); }
.topbar-in { max-width: 720px; margin: 0 auto; padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.mini-logo { background: #fff; border-radius: 10px; padding: 3px 8px; border: 2px solid var(--bd); display: flex; }
.mini-logo img { height: 30px; width: auto; display: block; }
.who { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.livedot { width: 9px; height: 9px; border-radius: 50%; background: #2fc582; display: inline-block; margin-right: 6px; animation: pulse 2.2s infinite; }
button.refresh { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--bd); background: var(--card); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 3px 0 var(--bd); display: grid; place-items: center; }
button.refresh:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--bd); }
button.refresh.busy span { display: inline-block; animation: spin .8s linear infinite; }
button.refresh:disabled { opacity: .8; }

/* ---------- navigasi bawah ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; padding: 0 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
.tabs { pointer-events: auto; max-width: 560px; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--card); border: 2.5px solid var(--bd); border-radius: 24px; box-shadow: var(--sh); padding: 5px; }
.tabs button { font: inherit; border: 0; background: transparent; color: var(--muted); border-radius: 18px; padding: 6px 2px 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; transition: background .2s, color .2s, transform .2s; }
.tabs svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-selected="true"] { background: var(--sun); color: #3a2a00; transform: translateY(-2px); }

.panel { display: flex; flex-direction: column; gap: 18px; }
.panel[hidden] { display: none; }
svg.map { display: block; max-width: 560px; margin-left: auto; margin-right: auto; }
.panel.enter { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }

/* ---------- kartu bergaya stiker ---------- */
.card { background: var(--card); border: 2.5px solid var(--bd); border-radius: 22px; box-shadow: var(--sh); padding: 16px; position: relative; }
.card h2 { font-size: 19px; margin-bottom: 2px; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tint-sky { background: var(--sky); } .tint-peach { background: var(--peach); } .tint-mint { background: var(--mint); } .tint-sun { background: #fff3c4; }
@media (prefers-color-scheme: dark) { .tint-sun { background: #3a3414; } }

/* ---------- sampul buku ---------- */
.cover { position: relative; border-radius: 22px; border: 2.5px solid var(--bd); box-shadow: var(--sh); padding: 18px 16px 16px 30px; overflow: hidden; color: #fff;
  background: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,.28) 1.5px, transparent 2px) 0 0 / 18px 18px, linear-gradient(160deg, #2f8bc4 0%, #2980b6 55%, #1f6a9c 100%); }
.cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: #0f3558; border-right: 2.5px solid var(--bd); }
.cover::after { content: ""; position: absolute; left: 7px; top: 14px; bottom: 14px; width: 0; border-left: 2.5px dashed rgba(255,255,255,.55); }
.label { background: #fffdf4; color: #0e2740; border: 2.5px solid #103c61; border-radius: 14px; padding: 10px 14px 6px; transform: rotate(-1.2deg); box-shadow: 0 3px 0 rgba(16,60,97,.55); }
.label .top { font-family: var(--font-display); font-weight: 600; letter-spacing: .14em; font-size: 11px; color: #2980b6; text-transform: uppercase; }
.label .row { display: flex; align-items: baseline; gap: 10px; border-bottom: 1.5px dotted #9db7cc; padding: 3px 0; min-height: 34px; }
.label .row:last-child { border-bottom: 0; }
.label .k { font-size: 12px; font-weight: 800; color: #52687c; min-width: 48px; text-transform: uppercase; letter-spacing: .04em; }
.label .v { font-family: var(--font-hand); font-weight: 700; font-size: 25px; line-height: 1.1; color: #103c61; overflow-wrap: anywhere; }
.label .v.small { font-size: 21px; }
.label img { height: 34px; width: auto; display: block; align-self: center; }
.cover .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.pillbtn { font: inherit; font-weight: 800; font-size: 13px; border: 2.5px solid #103c61; background: var(--sun); color: #3a2a00; border-radius: 999px; padding: 4px 12px; cursor: pointer; box-shadow: 0 3px 0 #103c61; }
.pillbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #103c61; }
.chip { font-size: 12.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.2); color: #fff; display: inline-flex; align-items: center; }
.pencil-deco { position: absolute; right: 14px; top: 10px; width: 14px; height: 70px; transform: rotate(18deg); opacity: .95; }

/* ---------- tiket hitung mundur ---------- */
.ticket { display: flex; background: var(--peach); border: 2.5px solid var(--bd); border-radius: 20px; box-shadow: var(--sh); position: relative; overflow: visible; }
.ticket .stub { padding: 12px 16px; text-align: center; border-right: 3px dashed var(--bd); min-width: 118px; display: flex; flex-direction: column; justify-content: center; position: relative; }
.ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; right: -12px; width: 21px; height: 21px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--bd); }
.ticket .stub::before { top: -12px; clip-path: inset(50% 0 0 0); } .ticket .stub::after { bottom: -12px; clip-path: inset(0 0 50% 0); }
.ticket .big { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1; color: var(--orange-d); font-variant-numeric: tabular-nums; }
.ticket .unit { font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ticket .info { padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.ticket .info b { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.ticket .info span { font-size: 13px; color: var(--muted); font-weight: 600; }

/* ---------- stiker angka ---------- */
.stickers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 4px; }
.sticker { border: 2.5px solid var(--bd); border-radius: 20px; padding: 12px 8px; text-align: center; box-shadow: var(--sh); }
.sticker:nth-child(1) { background: var(--sky); transform: rotate(-1.6deg); }
.sticker:nth-child(2) { background: var(--mint); transform: rotate(1.3deg); }
.sticker:nth-child(3) { background: var(--peach); transform: rotate(1.1deg); }
.sticker:nth-child(4) { background: #fff3c4; transform: rotate(-1.2deg); }
@media (prefers-color-scheme: dark) { .sticker:nth-child(4) { background: #3a3414; } }
.sticker b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.sticker span { display: block; font-size: 12.5px; font-weight: 800; color: var(--muted); margin-top: 3px; }
.say { font-size: 16px; font-weight: 800; margin: 8px 0 2px; text-wrap: pretty; }
.pill { display: inline-block; font-size: 13px; font-weight: 800; padding: 3px 12px; border-radius: 999px; border: 2px solid currentColor; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.near { background: var(--near-bg); color: var(--near); } .pill.low { background: var(--low-bg); color: var(--low); } .pill.none { background: var(--sky); color: var(--muted); }
.trend { font-size: 13px; color: var(--muted); font-weight: 600; }

/* ---------- kalkulator ---------- */
.calc .ctrl { display: grid; gap: 10px; margin: 6px 0 4px; }
.calc label { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
.calc label output { font-family: var(--font-display); font-size: 18px; color: var(--orange-d); }
.calc input[type=range] { width: 100%; accent-color: var(--orange); height: 28px; }
.gaugewrap { display: grid; grid-template-columns: 190px 1fr; gap: 10px; align-items: center; }
@media (max-width: 480px) { .gaugewrap { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
.gauge { width: 190px; height: auto; display: block; }
.gauge .trk { fill: none; stroke: var(--road); stroke-width: 15; stroke-linecap: round; }
.gauge .val { fill: none; stroke: var(--brand); stroke-width: 15; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .55s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.gauge .val.hi { stroke: var(--good); } .gauge .val.lo { stroke: var(--brand); }
.gauge .tick { stroke: var(--orange); stroke-width: 4; stroke-linecap: round; }
.gauge text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; }
.gauge text.small { font-family: var(--font-body); font-weight: 800; font-size: 11px; fill: var(--muted); }
.calcout p { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
.calcout .ok { color: var(--good); } .calcout .no { color: var(--orange-d); }

/* ---------- peta ---------- */
.map { width: 100%; height: auto; display: block; touch-action: manipulation; overflow: visible; }
.map .road { fill: none; stroke: var(--road); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.map .roadline { fill: none; stroke: var(--card); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.map .done { fill: none; stroke: var(--brand); stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
.mnode { cursor: pointer; outline: none; }
.mnode .pop { transition: transform .45s cubic-bezier(.3,1.7,.5,1); }
.mnode circle.c { stroke: var(--bd); stroke-width: 2.5; }
.mnode text { font-family: var(--font-display); font-weight: 700; font-size: 14px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mnode text.pc { font-family: var(--font-body); font-weight: 800; font-size: 11px; fill: var(--ink); dominant-baseline: auto; }
.mnode.hi circle.c { fill: var(--brand); } .mnode.hi text.n { fill: #fff; }
.mnode.lo circle.c { fill: var(--brand-2); } .mnode.lo text.n { fill: #0b2a44; }
.mnode.held circle.c { fill: var(--card); } .mnode.held text.n { fill: var(--ink); }
.mnode.next circle.c { fill: var(--orange); } .mnode.next text.n { fill: #3a1d00; }
.mnode.future circle.c { fill: var(--card); stroke-dasharray: 4 3; stroke: var(--muted); } .mnode.future text.n { fill: var(--muted); }
.mnode .ring { fill: none; stroke: var(--sel); stroke-width: 3.5; opacity: 0; transition: opacity .2s; }
.mnode.sel .ring { opacity: 1; }
.mnode .pulse { fill: none; stroke: var(--orange); stroke-width: 3; transform-origin: 0 0; animation: ping 1.8s ease-out infinite; }
.mnode .star { font-size: 13px; fill: #f2a200; dominant-baseline: auto; }
.mnode:focus-visible .ring { opacity: 1; }
.flagnode circle.c { fill: var(--sun); }
.pencil { pointer-events: none; animation: bob 1.6s ease-in-out infinite; }
.detail-strip { margin-top: 10px; background: var(--sky); border: 2px dashed var(--bd); border-radius: 16px; padding: 10px 14px; font-size: 14px; min-height: 72px; }
.detail-strip b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.detail-strip .materi { color: var(--muted); font-size: 13px; font-weight: 600; }
.detail-strip .res { margin-top: 3px; font-weight: 800; }
.tag { font-size: 12px; font-weight: 800; margin-left: 6px; }
.t-good { color: var(--good); } .t-near { color: var(--near); } .t-low { color: var(--low); } .t-none { color: var(--muted); font-weight: 700; } .t-hi { color: var(--brand); } .t-lo { color: var(--orange-d); }
@media (prefers-color-scheme: dark) { .t-hi { color: #7cc0ee; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; font-weight: 700; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; border: 2px solid var(--bd); }
.legend i.sq { border-radius: 4px; }
.legend i.dash { height: 0; width: 18px; border: 0; border-top: 2.5px dashed var(--orange); border-radius: 0; vertical-align: 3px; }
.legend i.fut { background: var(--card); border-style: dashed; border-color: var(--muted); }

/* ---------- grafik batang/garis ---------- */
.cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sky); border: 2.5px solid var(--bd); border-radius: 999px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 12.5px; font-weight: 800; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 3px 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { background: var(--brand); color: #06243b; } }
.chart { width: 100%; height: auto; display: block; touch-action: manipulation; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; font-weight: 700; }
.chart .val { fill: var(--ink); font-weight: 800; paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity .5s ease; }
.chart .grid { stroke: var(--ruled); stroke-width: 1.5; }
.chart .targetline { stroke: var(--orange); stroke-width: 2.5; stroke-dasharray: 6 4; }
.chart .targetlabel { fill: var(--orange-d); font-weight: 800; }
.chart .barfill { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .85s cubic-bezier(.2,.8,.2,1), fill .2s; stroke: var(--bd); stroke-width: 2; }
.chart .barfill.hi { fill: var(--brand); } .chart .barfill.lo { fill: var(--brand-2); } .chart .barfill.sel { fill: var(--orange); }
.chart .linepath { fill: none; stroke: var(--bd); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1); }
.chart .area { opacity: 0; transition: opacity .9s ease .4s; }
.chart .dot { stroke: var(--bd); stroke-width: 2.5; transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1), fill .2s; }
.chart .dot.hi { fill: var(--brand); } .chart .dot.lo { fill: var(--brand-2); } .chart .dot.sel { fill: var(--orange); }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .hit:focus-visible { stroke: var(--brand); stroke-width: 2; rx: 6; }
.chart.instant *, .radar.instant * { transition: none !important; }
.empty { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; font-weight: 600; }

/* ---------- radar ---------- */
.radar { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; touch-action: manipulation; }
.radar .ring { fill: none; stroke: var(--ruled); stroke-width: 1.8; }
.radar .axis { stroke: var(--ruled); stroke-width: 1.5; }
.radar .tring { fill: none; stroke: var(--orange); stroke-width: 2.5; stroke-dasharray: 6 4; }
.radar .rpoly { fill: var(--brand); fill-opacity: .28; stroke: var(--brand); stroke-width: 3.5; stroke-linejoin: round; }
.radar .vert { stroke: var(--bd); stroke-width: 2.5; }
.radar .vert.v-good { fill: var(--good); } .radar .vert.v-near { fill: #e0a000; } .radar .vert.v-low { fill: var(--low); } .radar .vert.v-none { fill: var(--card); }
.radar text { font-family: var(--font-display); font-weight: 700; font-size: 13px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.radar .g0 { fill: var(--g0); } .radar .g1 { fill: var(--g1); } .radar .g2 { fill: var(--g2); }
.radar .lab.sel { font-size: 17px; }
.radar .hit { fill: transparent; cursor: pointer; outline: none; }
.radar .hit:focus-visible { stroke: var(--brand); stroke-width: 2; }
.radar .pct { font-family: var(--font-body); font-size: 10.5px; font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 3px; }
.legend i.g0 { background: var(--g0); } .legend i.g1 { background: var(--g1); } .legend i.g2 { background: var(--g2); }

/* ---------- kemampuan ---------- */
.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; font-family: var(--font-body); font-weight: 800; }
.group.g0 h3 { color: var(--g0); } .group.g1 h3 { color: var(--g1); } .group.g2 h3 { color: var(--g2); } .group.g3 h3 { color: var(--muted); }
.group:first-child h3 { margin-top: 0; }
.skill { margin-bottom: 6px; border-radius: 14px; }
.skillbtn { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border: 0; padding: 6px 6px; border-radius: 14px; cursor: pointer; }
.skillbtn:hover { background: var(--sky); }
.skillbtn.static { cursor: default; } .skillbtn.static:hover { background: transparent; }
.skill .top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 5px; font-weight: 700; }
.skill .top span:last-child { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chev { display: inline-block; margin-left: 6px; color: var(--muted); font-size: 11px; transition: transform .25s; }
.skillbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.track { position: relative; height: 14px; border-radius: 999px; background: var(--road); border: 2px solid var(--bd); overflow: visible; }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.track > u { position: absolute; top: -5px; bottom: -5px; width: 3px; border-radius: 2px; background: var(--orange); }
.s-good > i { background: var(--good); } .s-near > i { background: #e0a000; } .s-low > i { background: var(--low); }
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.more.open { grid-template-rows: 1fr; }
.more > div { overflow: hidden; }
.more p { margin: 6px 4px 8px; padding: 8px 12px; border-radius: 12px; background: var(--sky); font-size: 13.5px; font-weight: 600; }

.level h2 { font-size: 21px; } .level .xp { font-size: 13px; color: var(--muted); font-weight: 700; margin: 2px 0 8px; }
.xpbar { height: 16px; border-radius: 999px; background: var(--card); border: 2.5px solid var(--bd); overflow: hidden; }

  function sum(arr, f) { return arr.reduce(function (a, x) { return a + f(x); }, 0); }

  /* ---------- bagian-bagian halaman ---------- */
  function levelKey(p, target) { if (p === null || p === undefined) return null; return p >= target ? 'good' : (p >= target - 0.10 ? 'near' : 'low'); }
  function starSvg() {

    pencil.appendChild(sv('path', { d: 'M1 50 L7 68 L13 50 Z', fill: '#f3d3a8', stroke: '#103c61', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    pencil.appendChild(sv('rect', { x: 1, y: 1, width: 12, height: 8, rx: 2, fill: '#f2a0a0', stroke: '#103c61', 'stroke-width': 2 }));
    return pencil;
  }

  function coverCard(d) {
    var cover = el('header', { class: 'cover' });
    cover.appendChild(starSvg());
    cover.appendChild(el('div', { class: 'label' }, [
      el('div', { class: 'top', text: 'Buku laporan belajar' }),
      el('div', { class: 'row' }, [el('span', { class: 'k', text: 'Nama' }), el('span', { class: 'v', text: d.nama })]),
      el('div', { class: 'row' }, [el('span', { class: 'k', text: 'Mapel' }), el('span', { class: 'v small', text: 'TKA Bahasa Indonesia SD' })]),
      el('div', { class: 'row' }, [el('span', { class: 'k', text: 'Bimbel' }), logoImg()])
    ]));
    var star = d.summary && d.summary.level === 'good';
    updChip = el('span', { class: 'chip' }, [el('span', { class: 'livedot', 'aria-hidden': 'true' }), 'Diperbarui otomatis · ' + hhmm(d.updated)]);

    if (star) { var s = el('div', { class: 'star' }); s.innerHTML = '<div><em>⭐</em>Target<br>tercapai</div>'; cover.appendChild(s); }
    return cover;
  }

  function statusCard(d, prev) {
    var s = d.summary, lv = (s.level === 'good' || s.level === 'near' || s.level === 'low') ? s.level : 'none';
    var face = { good: '😄', near: '🙂', low: '💪', none: '📖' }[lv];
    var label = { good: 'Sudah baik', near: 'Hampir tercapai', low: 'Perlu penguatan', none: 'Belum ada data' }[lv];
    var head = el('section', { class: 'card status ' + lv, 'aria-label': 'Ringkasan' }, [
      el('div', { class: 'face', 'aria-hidden': 'true', text: face }),
      el('div', {}, [
        el('span', { class: 'pill ' + lv, text: label }),
        el('p', { class: 'say', text: s.text }),
        d.trend ? el('div', { class: 'trend', text: d.trend.text }) : null
      ])
    ]);
    var items = [
      { v: d.latest, label: 'Latihan terakhir', pv: prev && prev.latest },
      { v: d.avg, label: 'Rata-rata', pv: prev && prev.avg },
      { v: d.hadir.pct, label: 'Kehadiran', pv: prev && prev.hadir && prev.hadir.pct }

  start();
})();
